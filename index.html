<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scripture Lifeline</title>

<meta name="theme-color" content="#2563eb">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
margin-top:10px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:8px;
}

h1{
color:#2563eb;
}

.challenge{
font-size:22px;
font-weight:bold;
padding:15px;
background:#eef4ff;
border-radius:8px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📖 Scripture Lifeline</h1>
<p>The right Scripture at the right time.</p>

<div class="card">

<h2>Add Scripture</h2>

<input id="book" placeholder="Book">

<input id="chapter" placeholder="Chapter">

<input id="verse" placeholder="Verse">

<textarea id="text" placeholder="Enter Scripture"></textarea>

<button onclick="saveVerse()">Save Verse</button>

</div>

<div class="card">

<h2>My Scriptures</h2>

<div id="verseList"></div>

</div>

<div class="card">

<h2>First Letter Challenge</h2>

<div id="challengeArea">

No verse selected.

</div>

</div>

<div class="card">

<h2>Reference Challenge</h2>

<div id="referenceArea">

No verse selected.

</div>

</div>

<div class="card">

<h2>Emergency Numbers</h2>

<input id="topic" placeholder="Topic (Fear, Anxiety, etc.)">

<input id="ref" placeholder="Reference (Isaiah 41:10)">

<button onclick="saveEmergency()">Save Emergency Number</button>

<div id="emergencyList"></div>

</div>

</div>

<script>

let verses =
JSON.parse(localStorage.getItem("verses")) || [];

let emergency =
JSON.parse(localStorage.getItem("emergency")) || [];

function saveVerse(){

const verse = {
book: document.getElementById("book").value,
chapter: document.getElementById("chapter").value,
verse: document.getElementById("verse").value,
text: document.getElementById("text").value
};

verses.push(verse);

localStorage.setItem(
"verses",
JSON.stringify(verses)
);

loadVerses();

alert("Verse Saved");

}

function loadVerses(){

const list =
document.getElementById("verseList");

list.innerHTML="";

verses.forEach((v,index)=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=
`
<strong>${v.book} ${v.chapter}:${v.verse}</strong><br>
${v.text}
<br><br>
<button onclick="firstLetter(${index})">
First Letter Challenge
</button>
<button onclick="referenceChallenge(${index})">
Reference Challenge
</button>
`;

list.appendChild(div);

});

}

function firstLetter(index){

const verse = verses[index];

const letters =
verse.text
.split(" ")
.map(word => word.charAt(0))
.join(" ");

document.getElementById(
"challengeArea"
).innerHTML =
`
<div class="challenge">
${letters}
</div>
`;

}

function referenceChallenge(index){

const verse = verses[index];

document.getElementById(
"referenceArea"
).innerHTML=
`
<div class="challenge">
${verse.text}
<br><br>
Book:
________
<br><br>
Chapter:
________
<br><br>
Verse:
________
</div>
`;

}

function saveEmergency(){

const item = {
topic: document.getElementById("topic").value,
reference: document.getElementById("ref").value
};

emergency.push(item);

localStorage.setItem(
"emergency",
JSON.stringify(emergency)
);

loadEmergency();

}

function loadEmergency(){

const list =
document.getElementById("emergencyList");

list.innerHTML="";

emergency.forEach(e=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=
`
<strong>${e.topic}</strong>
<br>
${e.reference}
`;

list.appendChild(div);

});

}

loadVerses();
loadEmergency();

</script>

</body>
</html>
